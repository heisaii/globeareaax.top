<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <title>Search — GlobeAreaAX</title>
  <style>
    :root{color-scheme:light dark;--bg:#f7f8fa;--card:#fff;--text:#17202a;--muted:#667085;--accent:#1677ff;--border:#e4e7ec}
    @media(prefers-color-scheme:dark){:root{--bg:#111827;--card:#1f2937;--text:#f3f4f6;--muted:#9ca3af;--accent:#60a5fa;--border:#374151}}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.65 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    header,main{width:min(860px,calc(100% - 32px));margin:auto}header{padding:38px 0 18px}header a{color:var(--text);font-size:24px;font-weight:750;text-decoration:none}
    h1{font-size:clamp(28px,5vw,42px);line-height:1.15;margin:22px 0}form{display:flex;gap:10px;margin-bottom:28px}input{flex:1;min-width:0;padding:13px 15px;border:1px solid var(--border);border-radius:10px;background:var(--card);color:var(--text);font:inherit}button{padding:13px 20px;border:0;border-radius:10px;background:var(--accent);color:white;font:inherit;font-weight:700;cursor:pointer}
    #status{color:var(--muted);margin-bottom:14px}.result{display:block;margin:12px 0;padding:20px;border:1px solid var(--border);border-radius:12px;background:var(--card);color:inherit;text-decoration:none}.result:hover{border-color:var(--accent)}.result h2{margin:0 0 7px;font-size:21px}.result p{margin:0;color:var(--muted)}
  </style>
</head>
<body>
  <header><a href="/">GlobeAreaAX</a></header>
  <main>
    <h1>Search the site</h1>
    <form action="/search/" method="get"><input id="query" name="q" type="search" placeholder="Search articles" required autofocus><button type="submit">Search</button></form>
    <div id="status" aria-live="polite"></div><div id="results"></div>
  </main>
  <script>
    const input=document.querySelector('#query'),status=document.querySelector('#status'),results=document.querySelector('#results');
    const q=new URLSearchParams(location.search).get('q')?.trim()||''; input.value=q;
    function addResult(item){const a=document.createElement('a');a.className='result';a.href=item.url;const h=document.createElement('h2');h.textContent=item.title;const p=document.createElement('p');p.textContent=item.excerpt;a.append(h,p);results.append(a)}
    if(q){status.textContent='Searching…';fetch('/search-index.json').then(r=>r.json()).then(items=>{const terms=q.toLowerCase().split(/\s+/).filter(Boolean);const found=items.map(item=>{const title=item.title.toLowerCase(),hay=(item.title+' '+item.content).toLowerCase();const score=terms.reduce((n,t)=>n+(title.includes(t)?5:0)+(hay.includes(t)?1:0),0);return{item,score}}).filter(x=>x.score>=terms.length).sort((a,b)=>b.score-a.score).slice(0,50);status.textContent=found.length?`${found.length} result${found.length===1?'':'s'} for “${q}”`:`No results for “${q}”`;found.forEach(x=>addResult(x.item))}).catch(()=>status.textContent='Search is temporarily unavailable.')}
  </script>
</body>
</html>
